apply plugin: 'com.android.library'

android {
    namespace 'tv.danmaku.ijk.media.player'
    compileSdk 35

    lintOptions {
        abortOnError false
    }
    defaultConfig {
        minSdk 23
        targetSdk 35
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

