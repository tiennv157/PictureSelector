apply plugin: 'com.android.library'

buildscript {
    repositories {
        jcenter()
    }
    dependencies {

    }
}

android {
    namespace 'top.zibin.luban'
    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
}

ext {
    PUBLISH_ARTIFACT_ID = "compress"
}

apply from: '../publish.gradle'

dependencies {}